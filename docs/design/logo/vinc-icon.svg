<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 72 72">
  <!-- Vinc — logo oficial (D-042, rodada 16b opção A5 "a pessoa no centro"):
       o V que fecha num vértice único e o ponto lilás na abertura — uma
       pessoa de braços abertos; o vínculo com gente no centro. -->
  <rect width="72" height="72" rx="18" fill="#6D28D9"/>
  <g fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round">
    <path d="M 21 22 L 36 52"/>
    <path d="M 51 22 L 36 52"/>
  </g>
  <circle cx="36" cy="25" r="7" fill="#A78BFA"/>
</svg>
